<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0}
  .og{width:1200px;height:630px;position:relative;overflow:hidden;display:flex;align-items:center;gap:56px;padding:0 90px;box-sizing:border-box;
    background:linear-gradient(#63c1ff 0%,#d6efff 78%);font-family:"Nunito",sans-serif;color:#10213f}
  .og::after{content:"";position:absolute;left:0;right:0;bottom:0;height:110px;background:linear-gradient(#2b8de0,#1d5fa8);border-top:5px solid #10213f}
  .sun{position:absolute;right:90px;top:60px;width:120px;height:120px;border-radius:50%;background:#ffd23f;border:5px solid #10213f;box-shadow:0 0 0 30px rgba(255,255,255,.35)}
  .logo{position:relative;z-index:1;width:300px;height:300px;flex:none;border-radius:66px;background:#10213f;display:flex;align-items:center;justify-content:center;
    font-family:"Lilita One";font-size:146px;line-height:1;color:#fff7ea;box-shadow:0 10px 0 rgba(16,33,63,.35)}
  .pipe{display:inline-block;width:18px;height:146px;border-radius:9px;margin:0 13px;background:#ff7a2f;transform:translateY(4px) rotate(8deg)}
  .g{color:#ffd23f}
  .txt{position:relative;z-index:1}
  h1{font-family:"Lilita One";font-weight:400;font-size:92px;margin:0 0 10px;line-height:1}
  p{font-size:34px;margin:0 0 22px;max-width:640px;line-height:1.3}
  .term{display:inline-block;background:#10213f;color:#fff7ea;border-radius:14px;padding:10px 20px;font:700 28px ui-monospace,Menlo,monospace}
  .term b{color:#ffd23f}
</style></head>
<body><div class="og"><div class="sun"></div>
  <div class="logo"><span>C</span><span class="pipe"></span><span class="g">G</span></div>
  <div class="txt"><h1>Catgrep SRL</h1><p>Software engineering consulting in Brussels, and a sailing game called Tailwind.</p><div class="term">$ cat company.txt | grep <b>-i "fun"</b></div></div>
</div></body></html>
